<div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;max-width:480px;margin:auto;padding:24px;color:#0f172a">
  <h2 style="margin:0 0 8px">رمز الدخول إلى إيثار</h2>
  <p>استعمل هذا الرمز لتسجيل الدخول (صالح لمدة قصيرة ولمرة واحدة):</p>
  <p style="font-size:32px;font-weight:bold;letter-spacing:8px;direction:ltr;text-align:center;background:#f1f5f9;border-radius:12px;padding:12px">{{ .Token }}</p>
  <p>أو اضغط على الرابط: <a href="{{ .ConfirmationURL }}">تسجيل الدخول</a></p>
  <hr style="border:none;border-top:1px solid #e2e8f0">
  <p dir="ltr" style="font-size:12px;color:#64748b">Code de connexion Athar : {{ .Token }}. Si vous n'avez rien demandé, ignorez ce message.</p>
</div>
