name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key-not-a-secret
      ATHAR_HMAC_SECRET: ci-placeholder-hmac-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database-and-e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta
      - name: Database tests (RLS, RPCs)
        run: npx supabase test db
      - name: Generated types are up to date
        run: |
          npx supabase gen types typescript --local > /tmp/types.ts
          diff -q /tmp/types.ts lib/supabase/database.types.ts
      - name: Write .env.local from local stack
        run: |
          npx supabase status -o json > /tmp/sb.json
          node -e '
            const s = require("/tmp/sb.json"); const c = require("crypto");
            require("fs").writeFileSync(".env.local", [
              `NEXT_PUBLIC_SUPABASE_URL=${s.API_URL}`, `NEXT_PUBLIC_SUPABASE_ANON_KEY=${s.ANON_KEY}`,
              `SUPABASE_SERVICE_ROLE_KEY=${s.SERVICE_ROLE_KEY}`, "NEXT_PUBLIC_SITE_URL=http://localhost:3000",
              `ATHAR_HMAC_SECRET=${c.randomBytes(32).toString("hex")}`, "SMS_PROVIDER=console", "ATHAR_DEV_ALLOW_NO_CAPTCHA=true"].join("\n"));'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: |
          npx next start -p 3000 &
          npx wait-on http://localhost:3000 --timeout 60000
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results/, retention-days: 7 }
